name: Check for Slay the Spire 2 patches

on:
  schedule:
    - cron: "4,19,34,49 * * * *" # off the :00 peak, where GitHub delays/drops runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun src/main.ts check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist state
        run: |
          git diff --quiet state.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update seen patch notes [skip ci]"
          git push
